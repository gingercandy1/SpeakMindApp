name: Android APK

# Builds the Flutter app for Android on every push to master, on pull
# requests, on demand, and when a v* tag is pushed (which also creates a
# GitHub Release with the APK attached).
#
# The release APK is signed with the debug key (see
# android/app/build.gradle.kts). That is fine for sideloading / testing.
# For Play Store distribution, add a signing keystore as repository
# secrets and a signing config later; do not commit a keystore.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
      
      - name: Run tests
        run: flutter test

      - name: Install Android NDK
        run: |
          for i in 1 2 3; do
            if yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"; then
              break
            fi
            echo "NDK install attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: speakmind-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
